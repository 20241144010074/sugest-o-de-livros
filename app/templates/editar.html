<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Editar Livro</title>
</head>
<body>

    <h1>Editar Livro</h1>

    <form method="POST">

        <label>Título:</label>
        <input type="text" name="titulo" value="{{ livro.titulo }}" required>
        <br><br>

        <label>Autor:</label>
        <input type="text" name="autor" value="{{ livro.autor }}" required>
        <br><br>

        <label>Gênero:</label>
        <input type="text" name="genero" value="{{ livro.genero }}" required>
        <br><br>

        <label>Descrição:</label>
        <textarea name="descricao">{{ livro.descricao }}</textarea>
        <br><br>

        <button type="submit">Salvar alterações</button>

    </form>

    <br>

    <a href="{{ url_for('main.index') }}">Voltar</a>

</body>
</html>
